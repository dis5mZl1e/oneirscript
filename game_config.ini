; ============================================================================
;  梦层 · 玩家配置文件  /  Oneirscript · Player Config  (game_config.ini)
; ----------------------------------------------------------------------------
;  改完保存后**重启游戏**即可生效；游戏运行中改这个文件不会被读取。
;  Save this file and restart the game to apply; edits are not read while running.
;
;  生效优先级（高 → 低）/ Priority (high -> low):
;    ① 游戏内设置页改过的项（记录在 save/config.json）
;       options changed in the in-game settings page (saved in save/config.json)
;    ② 本文件的取值 / values in this file
;    ③ 游戏内置默认值 / built-in defaults
;  也就是说：没在游戏里动过的项，一律听本文件的；在游戏里选过的项（比如
;  语言）以游戏内那次选择为准。想让本文件全部说了算，把下面
;  override_saved_settings 改成 true（语言仍然尊重游戏内记录）。
;  In short: options you never touched in game follow this file; options you did
;  change (e.g. language) keep your in-game choice. To let this file win
;  everywhere, set override_saved_settings below to true (language stays yours).
;
;  写法 / Syntax:
;    开关 booleans：true / false（也接受 1/0、开/关、yes/no、on/off）
;    数值 numbers：0~10        文本 enums：选项名 / option name
;    按键 keys：单个字符或 Alt+字母／数字 / one character or Alt+letter/digit
;    以 ; 或 # 开头的是注释，行尾注释同样会被忽略。
;    Lines starting with ; or # are comments; trailing comments are stripped too.
;    写错的项会被忽略并回退默认值，不影响其余项。
;    Bad values are ignored and fall back to defaults; other options still apply.
;  本文件为 UTF-8 编码，用记事本改完请保持编码不变（也接受 GBK）。
;  This file is UTF-8 (BOM); GBK is also accepted when reading.
; ============================================================================


; ---------------- 基础 / General ----------------
[general]
; true = 本文件的取值覆盖游戏内改过的设置；false = 游戏内改过的项保留。语言不受此项影响。
; true = values here override settings changed in game; false = in-game changes win. Does not apply to the language option.
override_saved_settings = false
; 首选语言：初次开启、游戏内没选过语言时按这里；在游戏内选过语言后永远按那次选择。
; Preferred language: used on first launch / when never set in game; once you pick a language in game, that choice always wins.
; 可选：zh / en
; Options: zh / en
language = zh
; 开启后新建存档直接进入第一层；不改变已有存档的教程状态。
; New saves begin in the first stratum. Existing saves keep their tutorial state.
; 开关：true / false
; Boolean: true / false
skip_tutorial = false
; 中文语序＝修饰在前、行为在四列；英文语序把行为前移到三列，宾语在后。只影响新盘面与词牌标签，不改变任何效果、费用或冷却。
; Chinese order puts modifiers first and the action in column four; English order moves the action to column three with the object after it. It only affects new boards and card labels — no effect, cost or cooldown changes.
; 可选：zh / en
; Options: zh / en
equipment_syntax = zh
; 异象开始怀疑、调查、逃离、蓄力、被打断或进入恢复时，在该格短暂亮起小角标；追踪状态不再显示最高频的「!」。关闭不影响技能危险区域与观察文字。
; 开关：true / false
; Boolean: true / false
intent_hints = true
; 开启后异象切换意图时，在角色地图给异象所在整格字形叠前景高亮；默认关闭，避免大标记周期性重绘影响连续移动。右上角小角标不受影响。
; When on, highlight the whole anomaly glyph cell in character mode on intent switches; off by default to avoid periodic full-cell redraws. Corner badge is separate.
; 开关：true / false
; Boolean: true / false
intent_large_marks = false

; ---------------- 画面 / Display ----------------
[display]
; 切换主题符号与固定双列 ASCII 符号。
; Switch between themed glyphs and fixed two-column ASCII.
; 可选：themed / ascii
; Options: themed / ascii
symbol_mode = themed
; 地图动态光影：关闭 / 流畅（10 帧） / 完整（呼吸光环·暗角·涟漪）。
; Map dynamic lighting: off / smooth (10 fps) / full (breathing halo, vignette, ripples).
; 可选：off / low / high
; Options: off / low / high
fx_quality = high
; 低清醒度时的隔行扫描线（CRT 暗线）。可独立于画面特效开关。
; Interlaced scanlines at low lucidity (CRT dark lines); independent of the FX switch.
; 开关：true / false
; Boolean: true / false
fx_scanlines = true
; 下潜/上浮时旧层崩解、新层在角色周围生成；关闭则直接切换。
; On descend/ascent, the old floor collapses and the new one forms around the character; disable for an instant switch.
; 开关：true / false
; Boolean: true / false
floor_transition = true
; 动态光照作用于地板、墙体与一切格子；关闭则只照亮可通行的格。
; Dynamic lighting affects floors, walls and every cell; disable to light only walkable cells.
; 开关：true / false
; Boolean: true / false
fx_light_walls = true
; 自动优先图像（适配终端时），否则字符；图像初始化失败会回退字符并给出原因。
; 可选：auto / image / character
; Options: auto / image / character
map_display = auto
; F3 进入分层观察；观察层切换只在本次界面生效，不覆盖本机地图显示偏好。
; 可选：composite / floor / low / middle / high / liquid / gas / elevation / terrain / sound
; Options: composite / floor / low / middle / high / liquid / gas / elevation / terrain / sound
map_observe = composite

; ---------------- 音频 / Audio ----------------
[audio]
; 移动、投掷、下潜等动作音效。
; Action sounds for moving, throwing and descending.
; 开关：true / false
; Boolean: true / false
sfx_enabled = true
; 0 静音，10 最响。
; 0 is silent, 10 is loudest.
; 数值：0 ~ 10
; Number: 0 ~ 10
sfx_volume = 7
; 播放主页、区域、梦中梦与结局音乐；与音效开关独立。
; Play menu, region, dream realm and ending music; independent of sound effects.
; 开关：true / false
; Boolean: true / false
music_enabled = true
; 背景音乐音量；0 为静音，不影响音效。
; Background music volume; 0 mutes music without affecting sound effects.
; 数值：0 ~ 10
; Number: 0 ~ 10
music_volume = 6

; ---------------- 玩法 / Gameplay ----------------
[gameplay]
; 安全时进入显化物所在格后自动收纳。
; Auto-collect manifestations you step on when safe.
; 开关：true / false
; Boolean: true / false
auto_pickup = false
; 控制行囊、观测录和操作页的灰色说明。
; Controls grey notes in bag, codex and action pages.
; 开关：true / false
; Boolean: true / false
show_details = true
; 开启后按小键盘 5 原地等待一回合；关闭则 5 无效，避免误触。
; When on, numpad 5 waits one turn in place; when off, 5 does nothing.
; 开关：true / false
; Boolean: true / false
numpad5_wait = true

; ---------------- 按键 / Keys ----------------
[keys]
; 面板向上主键（WASD 面板操作，不是方向键走路）
; Panel Up key (WASD panel control, not arrow-key walking)
; 单个字符或 Alt+字母／数字（不能与 123456789 . f g e q u n b i k ? / h \ 冲突）
; One character or Alt+letter/digit (must not collide with 123456789 . f g e q u n b i k ? / h \)
key_up = w
; 面板向下主键
; Panel Down key
; 单个字符或 Alt+字母／数字（不能与 123456789 . f g e q u n b i k ? / h \ 冲突）
; One character or Alt+letter/digit (must not collide with 123456789 . f g e q u n b i k ? / h \)
key_down = s
; 面板向左主键
; Panel Left key
