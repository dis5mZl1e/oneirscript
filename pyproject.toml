[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneirscript"
version = "0.9.0"
description = "梦层（Oneirscript）—— 一款以潜意识为舞台的传统 roguelike：回合制、ASCII 平面、环境化学与可篡改的现实。"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "dis5mZl1e" }]
requires-python = ">=3.11"
keywords = ["roguelike", "dream", "textual", "terminal-game", "ascii", "procedural", "oneirscript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "rich>=14,<15",
    "textual>=0.60,<1",
    "numpy>=1.24,<3",
    "asciimatics==1.15.0",
    "pygame>=2.6.1,<3",
    "openpyxl>=3.1,<4",
    "pillow>=10,<13",
    "fonttools>=4.50,<5",
]

[project.urls]
Repository = "https://github.com/dis5mZl1e/oneirscript"

[tool.setuptools.packages.find]
include = ["dream_demo*"]

[tool.setuptools.package-data]
"dream_demo" = ["mapgen/vaults/*.json"]
